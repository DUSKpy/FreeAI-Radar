name: publish

# The daily collection pipeline. Three stages, deliberately separated:
#
#   prepare  -- collect from the network, never has write permission
#   persist  -- the ONLY job allowed to commit, and it commits data only
#   deploy   -- publishes to Pages from the artifact prepare produced
#
# Why three jobs instead of one: the job that talks to untrusted third-party
# sites must not hold a token that can push to this repository. Splitting them
# means a malicious upstream response cannot rewrite the repo, because the
# collection job literally does not have the credentials to do so.

on:
  schedule:
    # 00:23 UTC = 08:23 Asia/Shanghai. The odd minute avoids the top-of-hour
    # congestion that delays every scheduled job on GitHub's shared runners.
    - cron: "23 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore conditional-request caches and re-fetch every source"
        type: boolean
        default: false
      only:
        description: "Comma-separated source ids to collect (empty = all enabled)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A daily job that overlaps itself would race on the state commit. Queue
  # rather than cancel: a cancelled collection still costs the upstream sites
  # a request, and the newer run would start from a stale state anyway.
  group: publish
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 -- collect. No write token, no secrets, read-only checkout.
  # ---------------------------------------------------------------------------
  prepare:
    name: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      dataset_version: ${{ steps.meta.outputs.dataset_version }}
      change_count: ${{ steps.meta.outputs.change_count }}
      degraded: ${{ steps.meta.outputs.degraded }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore the previous state
        # Cross-run persistence. The state file is the only thing that carries
        # history: without it every run looks like a first run, every offer is
        # "new", and the change log is meaningless.
        uses: actions/cache/restore@v4
        with:
          path: .work/state.json
          key: radar-state-${{ github.run_id }}
          restore-keys: |
            radar-state-

      - name: Fail loudly if the previous state is missing
        # A silent empty start is the single most damaging failure mode here:
        # the site would publish a full catalog and a change log claiming every
        # provider is brand new. Better to stop and let a human decide.
        run: |
          set -euo pipefail
          if [ ! -s .work/state.json ]; then
            echo "::warning::no previous state.json restored; this is a genuine first run"
            echo "FIRST_RUN=1" >> "$GITHUB_ENV"
          else
            echo "restored state: $(wc -c < .work/state.json) bytes"
            echo "FIRST_RUN=0" >> "$GITHUB_ENV"
          fi

      - name: Collect
        env:
          # Opt-in DNS proxy support. Some CI networks resolve through a proxy
          # that returns Clash/Surge fake-IP ranges (198.18.0.0/15). The guard
          # treats those as private unless explicitly allowed. Off by default.
          FA_RADAR_ALLOW_DNS_PROXY: ${{ vars.FA_RADAR_ALLOW_DNS_PROXY || '0' }}
        run: |
          set -euo pipefail
          # --previous is always passed, including on the first run. The path
          # must stay in the command so that a typo and a genuine first run
          # cannot look the same; --init is what authorises the missing file.
          args=(--config config/sources.yaml
                --reviews config/reviews.yaml
                --aliases config/aliases.yaml
                --previous .work/state.json
                --output .work/state.json)

          if [ "${FIRST_RUN}" = "1" ]; then
            args+=(--init)
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi

          if [ -n "${{ inputs.only }}" ]; then
            IFS=',' read -ra ids <<< "${{ inputs.only }}"
            for id in "${ids[@]}"; do
              args+=(--only "$(echo "$id" | xargs)")
            done
          fi

          python -m radar.collect "${args[@]}"

      - name: Export the public dataset
        run: |
          set -euo pipefail
          python -m radar.export_public \
            --state .work/state.json \
            --reviews config/reviews.yaml \
            --output .work/public \
            --base-path /${{ github.event.repository.name }}/ \
            --previous-public .work/public-previous

      - name: Build the site
        run: |
          set -euo pipefail
          python -m radar.build_site \
            --data .work/public \
            --base-path /${{ github.event.repository.name }}/ \
            --output dist \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --repo-branch "${{ github.ref_name }}" \
            --build-commit "${{ github.sha }}"

      - name: Check the published tree for secret-shaped strings
        run: python -m tests.scan_secrets dist

      - name: Summarise the run
        id: meta
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          m = json.loads(pathlib.Path("dist/data/manifest.json").read_text("utf-8"))
          counts = m.get("counts", {})
          print(f"dataset_version={m.get('dataset_version','')}")
          print(f"change_count={counts.get('changes_today', 0)}")
          # A run where no source succeeded is degraded, not failed: the site
          # keeps serving the last good data, but the daily report must say so.
          sources = m.get("sources", [])
          ok = [s for s in sources if s.get("status") == "ok"]
          healthy = len(ok) / len(sources) if sources else 0
          print(f"degraded={'true' if healthy < 0.5 else 'false'}")
          PY

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "### FreeAI Radar collection"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| dataset version | \`${{ steps.meta.outputs.dataset_version }}\` |"
            echo "| changes today | ${{ steps.meta.outputs.change_count }} |"
            echo "| degraded | ${{ steps.meta.outputs.degraded }} |"
            echo "| first run | ${FIRST_RUN} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the new state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .work/state.json
          # run_id makes the key unique so the cache is never silently rejected
          # as immutable; restore-keys picks up the newest one next run.
          key: radar-state-${{ github.run_id }}

      - name: Upload the collected state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ github.run_id }}
          path: .work/state.json
          retention-days: 90

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 14

      - name: Upload the public dataset
        # Kept separately so a reviewer can diff the JSON without downloading
        # the whole rendered site.
        uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: .work/public
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Stage 2 -- persist. The only job that may write to the repository.
  # ---------------------------------------------------------------------------
  persist:
    name: commit data
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only push on the default branch. A manual run on a topic branch should
    # still produce artifacts, but must never commit data to that branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A token with write access, scoped to this job only.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download the public dataset
        uses: actions/download-artifact@v4
        with:
          name: dataset
          path: .work/public

      - name: Download the collected state
        uses: actions/download-artifact@v4
        with:
          name: state-${{ github.run_id }}
          path: .work/state

      - name: Commit if and only if the data actually changed
        run: |
          set -euo pipefail
          mkdir -p data

          # ---- state -------------------------------------------------------
          # state.json is large and changes on every run even when the catalog
          # does not (timestamps, conditional-request ETags). It is committed
          # because it IS the cross-run memory, but it lives outside the
          # published tree.
          if [ -f .work/state/state.json ]; then
            cp .work/state/state.json data/state.json
          fi

          # ---- public dataset ---------------------------------------------
          cp -r .work/public/. data/public/

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "no data change; nothing to commit"
            echo "CHANGED=0" >> "$GITHUB_ENV"
          else
            # Say what changed in the subject, so the log is readable without
            # opening the diff.
            echo "CHANGED=1" >> "$GITHUB_ENV"
          fi

      - name: Commit and rebase-push
        if: env.CHANGED == '1'
        run: |
          set -euo pipefail
          git commit -m "data: daily collection ${{ needs.prepare.outputs.dataset_version }}

          changes today: ${{ needs.prepare.outputs.change_count }}
          degraded run: ${{ needs.prepare.outputs.degraded }}

          Generated by .github/workflows/publish.yml"

          # A rebase-then-push, never a force-push. If two runs raced, the
          # second one rebases on top; forcing would hide exactly the conflict
          # a reviewer needs to see.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" \
               && git push origin "HEAD:${{ github.ref_name }}"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "::warning::push attempt $attempt failed; retrying after rebase"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "::error::could not push after 3 attempts; leaving the commit unpushed rather than forcing"
          exit 1

  # ---------------------------------------------------------------------------
  # Stage 3 -- deploy to Pages.
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy to Pages
    needs: [prepare, persist]
    # `always()` would deploy a broken build. Deploying needs prepare to have
    # produced a site; persist is allowed to be skipped (topic branch) but must
    # not have failed.
    if: |
      always()
      && needs.prepare.result == 'success'
      && !cancelled()
      && (needs.persist.result == 'success' || needs.persist.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write
      contents: read

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Report the live URL
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- URL: ${{ steps.deploy.outputs.page_url }}"
            echo "- dataset: \`${{ needs.prepare.outputs.dataset_version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
