name: ci

# Runs on every push and pull request. This job never writes to the repository
# and never touches the network beyond the checkout and the package index, so a
# compromised source can never influence a build here.
#
# Collection itself lives in publish.yml, which is why this file needs no
# secrets and no elevated permissions.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege: the build only needs to read its own code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Ruff format check
        # Formatting is only advisory in CI: a contributor on a different
        # formatter version should not fail the build for a trailing comma.
        run: ruff format --check . || echo "::warning::ruff format would reformat some files"

      - name: Pytest
        # The suite is offline by design; any test marked `network` is
        # deselected here so a flaky upstream never reddens CI.
        run: pytest -m "not network"

      - name: Validate schemas against the committed fixture
        # Proves the JSON Schema files still describe the data the collectors
        # actually emit, without needing a live collection run.
        run: python -m tests.validate_fixtures

      - name: Build the site from the committed fixture state
        # A build must succeed from a clean checkout with no network. This is
        # the check that catches a template referring to a field that only
        # exists after a live collection.
        run: |
          set -euo pipefail
          python -m radar.export_public \
            --state tests/fixtures/state.minimal.json \
            --output .work/public \
            --base-path /freeai-radar/
          python -m radar.build_site \
            --data .work/public \
            --base-path /freeai-radar/ \
            --output dist

      - name: Assert the build produced every page
        run: |
          set -euo pipefail
          missing=0
          for f in index.html directory.html provider.html changes.html \
                   sources.html reviews.html favorites.html 404.html .nojekyll; do
            if [ ! -e "dist/$f" ]; then
              echo "::error::build did not produce dist/$f"
              missing=1
            fi
          done
          # The four stylesheets and the app entry point are the minimum asset
          # tree; a build that drops them renders unstyled but still exits 0.
          for f in assets/css/tokens.css assets/css/glass.css \
                   assets/css/components.css assets/css/pages.css \
                   assets/js/app.js assets/favicon.svg; do
            if [ ! -e "dist/$f" ]; then
              echo "::error::build did not produce dist/$f"
              missing=1
            fi
          done
          exit $missing

      - name: Check dist contains no secret-shaped strings
        # Belt and braces: the exporter has a field allowlist, but a regression
        # there would publish whatever slipped through. This turns that into a
        # build failure instead of a leak.
        run: python -m tests.scan_secrets dist

      - name: Upload the built site as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist
          retention-days: 7
