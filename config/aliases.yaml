# FreeAI Radar 别名表 / alias table
#
# 作用：把同一个提供商的多种写法归一到同一个 canonical slug。
#
# 为什么需要它：不同目录来源对同一家提供商的写法并不一致——有的写
# "Google AI Studio"，有的写 "Google Gemini"，还有的写 "gemini"。
# 如果不归一，同一家会以多个 provider 出现在目录里，用户看到重复条目，
# 而"跨来源确认"也会被误算成两个独立来源。
#
# 归一 ≠ 合并。归一只解决"名字写法不同"，不解决"政策不同"。
# 如果两家提供商的免费政策确实不同（哪怕是同一集团的子品牌），
# 它们就应当是两个 provider——不要为了页面好看去合并。
#
# 格式两种，都支持：
#
#   canonical-slug:
#     - alias-one
#     - alias-two
#
#   alias-slug: canonical-slug
#
# 左侧（canonical 或 alias）与右侧的值都会经过 slugify，所以
# "Google AI Studio" 与 "google-ai-studio" 等价，不必手写 slug。
#
# 一个 alias 只能指向一个 canonical。指向两个会直接让构建失败——
# 这是故意的：含糊的别名会让归属变得不可预测。

aliases:
  # ---------------------------------------------------------------------
  # Google —— 一个集团下多个入口，但 API 面是同一个
  # ---------------------------------------------------------------------
  # AI Studio 是控制台/文档入口，Gemini API 是它背后实际的 API。
  # 对使用 CC Switch 的人来说，"Google AI Studio" 与 "Gemini API"
  # 指的是同一个 endpoints，所以归一到一起。
  google-ai-studio:
    - google
    - google-gemini
    - gemini
    - gemini-api
    - google-ai
    - googleaistudio

  # ---------------------------------------------------------------------
  # Meta / Llama
  # ---------------------------------------------------------------------
  # Llama 是模型名不是提供商名，但目录来源里常被当成一格来写。
  # 归一到 Meta，避免出现一个叫 "Llama" 的假提供商。
  meta-llama:
    - meta
    - llama
    - llama-api

  # ---------------------------------------------------------------------
  # xAI
  # ---------------------------------------------------------------------
  xai:
    - x-ai
    - grok
    - grok-api

  # ---------------------------------------------------------------------
  # Mistral
  # ---------------------------------------------------------------------
  mistral:
    - mistral-ai
    - mistralai

  # ---------------------------------------------------------------------
  # Cerebras
  # ---------------------------------------------------------------------
  cerebras:
    - cerebras-systems
    - cerebras-inference

  # ---------------------------------------------------------------------
  # Together
  # ---------------------------------------------------------------------
  together:
    - together-ai
    - togetherai
    - together-ai-inference

  # ---------------------------------------------------------------------
  # Fireworks
  # ---------------------------------------------------------------------
  fireworks:
    - fireworks-ai
    - fireworksai

  # ---------------------------------------------------------------------
  # OpenRouter / OpenAI 系
  # ---------------------------------------------------------------------
  openrouter:
    - open-router

  openai:
    - open-ai
    - chatgpt
    - chat-gpt-api

  # ---------------------------------------------------------------------
  # Anthropic
  # ---------------------------------------------------------------------
  anthropic:
    - claude
    - claude-api
    - anthropic-claude

  # ---------------------------------------------------------------------
  # 中国厂商
  # ---------------------------------------------------------------------
  # 目录来源里这些名字的英文/拼音/中文写法混用很常见。
  # 注意：不要因为"看起来像同一家"就归一。智谱 AI 与 Z.ai 是同一个
  # 实体的两个品牌，共用 API，所以归一；而 通义千问 与 阿里云百炼 是
  # 同一集团下不同的产品面，暂不归一，等确认 endpoints 是否相同再加。
  zhipu:
    - z-ai
    - zhipuai
    - glm
    - chatglm
    - bigmodel

  deepseek:
    - deep-seek
    - deepseek-ai

  moonshot:
    - kimi
    - moonshot-ai
    - kimi-api

  minimax:
    - mini-max

  siliconflow:
    - silicon-flow
    - siliconflow-cn

  modelscope:
    - model-scope

  # ---------------------------------------------------------------------
  # 其他常见写法差异
  # ---------------------------------------------------------------------
  huggingface:
    - hugging-face
    - hf
    - huggingface-inference

  github-models:
    - github
    - gh-models

  cloudflare:
    - cloudflare-workers-ai
    - cf-workers-ai

  nvidia:
    - nvidia-nim
    - nim

  sambanova:
    - samba-nova

  scaleway:
    - scaleway-generative-apis

  ovhcloud:
    - ovh

  # ---------------------------------------------------------------------
  # 明确不归一的（写在这里是为了防止后来者"顺手"合并）
  # ---------------------------------------------------------------------
  # alibaba-dashscope 与 qwen 不归一：
  #   百炼是平台，Qwen 是模型家族，两者端点与计费面都不同。
  # 这里不写条目，保持它们各自独立。
