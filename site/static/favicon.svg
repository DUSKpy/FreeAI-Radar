<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="FreeAI Radar">
  <!--
    Radar mark: the same three-ring sweep used in the sidebar brand, redrawn on
    a 32px grid so it stays legible in a 16px browser tab. Kept as a crisp SVG
    with no external font, so the tab icon never flashes a missing glyph.
  -->
  <rect width="32" height="32" rx="7" fill="#142238"/>
  <g fill="none" stroke="#5aa9ff" stroke-width="1.6" opacity="0.55">
    <circle cx="16" cy="16" r="5.5"/>
    <circle cx="16" cy="16" r="10"/>
  </g>
  <path d="M16 16 L16 6" stroke="#5aa9ff" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <path d="M16 16 L24.5 11.5 A10 10 0 0 1 26 16 Z" fill="#5aa9ff" opacity="0.28"/>
  <circle cx="16" cy="16" r="2" fill="#7cc4ff"/>
  <circle cx="22" cy="11" r="1.75" fill="#3ddc97"/>
</svg>
